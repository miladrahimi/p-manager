<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>P-Manager</title>
    <link rel="stylesheet" href="assets/third_party/bootstrap-5.3.5/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/third_party/tabulator-6.3.1/dist/css/tabulator.min.css">
    <link rel="stylesheet" href="assets/third_party/tabulator-6.3.1/dist/css/tabulator_semanticui.min.css">
    <link rel="icon" href="assets/images/xray.svg?h=03c70e387db88eaafa49e3eeecd2fb40">
    <link rel="apple-touch-icon" href="assets/images/xray.svg?h=03c70e387db88eaafa49e3eeecd2fb40">
</head>
<body>

<div class="container py-4 text-center">
    <div class="col">
        <div class="text-center">
            <img src="assets/images/xray.svg?h=03c70e387db88eaafa49e3eeecd2fb40" alt="icon" class="img-fluid">
        </div>

        <ul class="nav nav-tabs small">
            <li class="nav-item">
                <a class="nav-link px-2" href="admin-users.html">Users</a>
            </li>
            <li class="nav-item">
                <span class="nav-link active px-2" aria-current="page">Nodes</span>
            </li>
            <li class="nav-item">
                <a class="nav-link px-2" href="admin-system.html">System</a>
            </li>
            <li class="nav-item">
                <span class="nav-link px-2" id="exit">Exit</span>
            </li>
        </ul>

        <div id="table" class="celled striped very compact"></div>

        <div class="input-group input-group-sm mt-2">
            <input type="text" class="form-control" id="node-json"
                   placeholder='Paste P-Node JSON here (e.g. {"ip":"...","http_port":1234,"http_token":"...","ssh_port":22,"ssh_user":"root"})'>
            <button class="btn btn-dark" id="create">+ Add Node</button>
        </div>
        <a class="btn btn-outline-dark btn-sm d-block mt-1" href="https://github.com/miladrahimi/p-node"
           target="_blank">
            P-Node GitHub
        </a>
    </div>
</div>

<script src="assets/third_party/jquery-3.7.1.min.js"></script>
<script src="assets/third_party/bootstrap-5.3.5/js/bootstrap.bundle.min.js"></script>
<script src="assets/third_party/tabulator-6.3.1/dist/js/tabulator.min.js"></script>
<script src="assets/js/utils.js?h=c101a9d14ade78e04eeb281043fdbc9f"></script>
<script>
    let statusFormatter = cell => {
        console.log(cell.getValue())
        switch (cell.getValue()) {
            case "":
                cell.getElement().style.color = "#595959"
                return "Processing..."
            case "available":
                cell.getElement().style.color = "#198754"
                return "Available"
            case "dirty":
                cell.getElement().style.color = "#a18823"
                return "Dirty"
            case "unavailable":
                cell.getElement().style.color = "#872919"
                return "Unavailable"
            default:
                cell.getElement().style.color = "#000000"
                return cell.getValue()
        }
    }

    let actionsFormatter = cell => [
        `<span class="badge bg-danger" onclick="destroy('${cell.getRow().getIndex()}')" title="Delete">X</span>`,
        `<span class="badge bg-info" onclick="info('${cell.getRow().getIndex()}')" title="Info">i</span>`,
    ].join('&nbsp')

    let destroy = rowIndex => {
        let confirmed = confirm("Press 'OK' to delete the node.")
        if (!confirmed) {
            return
        }

        let row = table.getRow(rowIndex)
        if (!row.getData().id) {
            table.deleteRow(rowIndex)
            return
        }

        table.alert("Deleting the node...", "msg")

        $.ajax({
            type: "DELETE",
            url: `/api/nodes/${rowIndex}`,
            contentType: "application/json",
            dataType: "json",
            processData: true,
            success: () => {
                table.alert("Item deleted successfully.", "msg")
                setTimeout(() => window.location.reload(), 1000)
            },
            error: makeErrorHandler(message => table.alert(message, "error")),
            complete: () => setTimeout(() => table.clearAlert(), 1500),
        })
    }

    let info = rowIndex => {
        let row = table.getRow(rowIndex)

        let baseUrl = window.location.origin
        let command = row.getData().pull_command
            .replace('BASE_URL', baseUrl)
            .replace('/v1/', '/api/')

        let content = `<div class="p-2">
            <p class="my-2"><h6>Node #${row.getData().id}</h6></p>
            <p class="my-2"><b>Pulling Setup Command:</b></p>
            <pre class="bg-light p-2 rounded">${command}</pre>
            <b>Last Push:</b> ${ts2datetime(row.getData().pushed_at)}<br>
            <b>Last Pull:</b> ${ts2datetime(row.getData().pulled_at)}<br>
        </div>`

        row.popup(content, "center");
    }

    let table = new Tabulator("#table", {
        ajaxURL: "/api/nodes",
        ajaxConfig: {
            headers: {
                "Authorization": `Bearer ${localStorage.getItem("token")}`,
            },
        },
        layout: "fitDataStretch",
        initialSort: [{column: "id", dir: "desc"}],
        validationMode: "blocking",
        columns: [
            {
                title: "Host",
                field: "host",
                editor: "input",
                widthGrow: 2,
                headerFilter: "input",
                validator: ["required"],
                editable: true,
            },
            {
                title: "HTTP Port",
                field: "http_port",
                visible: true,
                editor: "number",
                widthGrow: 1,
                validator: ["required", "min:1", "max:65536"],
                editable: true
            },
            {
                title: "HTTP Token",
                field: "http_token",
                editor: "input",
                widthGrow: 2,
                validator: ["required"],
                editable: true,
            },
            {
                title: "SSH User",
                field: "ssh_user",
                editor: "input",
                widthGrow: 1,
                validator: ["required"],
                editable: true,
            },
            {
                title: "SSH Port",
                field: "ssh_port",
                visible: true,
                editor: "number",
                widthGrow: 1,
                validator: ["required", "min:1", "max:65536"],
                editable: true
            },
            {
                title: "Usage (GB)",
                field: "usage",
                visible: true,
                widthGrow: 1,
                editable: false,
                formatter: cell => parseFloat(cell.getData()['usage']).toFixed(2)
            },
            {
                title: "Push Status", field: "push_status", widthGrow: 1, resizable: true, formatter: statusFormatter,
                headerPopup: "Status of the process where P-Manager pushes configurations to P-Nodes.",
            },
            {
                title: "Pull Status", field: "pull_status", widthGrow: 1, resizable: true, formatter: statusFormatter,
                headerPopup: "Status of the process where P-Nodes pull configurations from the P-Manager.",
            },
            {
                title: "Actions", formatter: actionsFormatter, hozAlign: "right",
            },
        ],
    })

    table.on("dataLoadError", makeErrorHandler())

    table.on("cellEdited", cell => {
        if (!cell.getData()['host'] || !cell.getData()['http_token'] || !cell.getData()['http_port'] ||
            !cell.getData()['ssh_user'] || !cell.getData()['ssh_port']) {
            return
        }

        table.alert("Saving the node...", "msg")

        let isNew = !cell.getData().id
        let method = isNew ? "POST" : "PUT"
        let url = isNew ? "/api/nodes" : `/api/nodes/${cell.getData().id}`

        $.ajax({
            type: method,
            url: url,
            contentType: "application/json",
            data: JSON.stringify(cell.getData()),
            dataType: "json",
            processData: true,
            success: () => {
                table.alert("Item saved successfully.", "msg")
                setTimeout(() => window.location.reload(), 1000)
            },
            error: makeErrorHandler(message => table.alert(message, "error")),
            complete: () => setTimeout(() => table.clearAlert(), 1500),
        })
    })

    $("#create").click(() => {
        let raw = $("#node-json").val().trim()
        if (!raw) {
            table.alert("Paste the P-Node JSON first.", "error")
            return
        }

        let payload
        try {
            payload = JSON.parse(raw)
        } catch (e) {
            try {
                payload = JSON.parse(raw.replace(/,(\s*[}\]])/g, "$1"))
            } catch (parseError) {
                table.alert("Invalid JSON payload.", "error")
                return
            }
        }

        let host = payload.ip || payload.host || ""
        let httpPort = parseInt(payload.http_port, 10)
        let sshPort = parseInt(payload.ssh_port, 10)
        let httpToken = payload.http_token || ""
        let sshUser = payload.ssh_user || ""

        if (!host || !httpToken || !httpPort || !sshUser || !sshPort) {
            table.alert("JSON payload is missing required fields.", "error")
            return
        }

        let request = {
            host: host,
            http_token: httpToken,
            http_port: httpPort,
            ssh_user: sshUser,
            ssh_port: sshPort,
        }

        table.alert("Adding the node...", "msg")

        $.ajax({
            type: "POST",
            url: "/api/nodes",
            contentType: "application/json",
            data: JSON.stringify(request),
            dataType: "json",
            processData: true,
            headers: {
                "Authorization": `Bearer ${localStorage.getItem("token")}`,
            },
            success: () => {
                table.alert("Item saved successfully.", "msg")
                setTimeout(() => window.location.reload(), 1000)
            },
            error: makeErrorHandler(message => table.alert(message, "error")),
            complete: () => setTimeout(() => table.clearAlert(), 1500),
        })
    })
</script>

</body>
</html>
