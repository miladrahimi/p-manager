<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>P-Manager</title>
    <link rel="stylesheet" href="assets/third_party/bootstrap-5.3.5/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/third_party/tabulator-6.3.1/dist/css/tabulator.min.css">
    <link rel="stylesheet" href="assets/third_party/tabulator-6.3.1/dist/css/tabulator_semanticui.min.css">
    <link rel="icon" href="assets/images/xray.svg?h=03c70e387db88eaafa49e3eeecd2fb40">
    <link rel="apple-touch-icon" href="assets/images/xray.svg?h=03c70e387db88eaafa49e3eeecd2fb40">
</head>
<body>

<div class="container py-4 text-center">
    <div class="col">
        <div class="text-center">
            <img src="assets/images/xray.svg?h=03c70e387db88eaafa49e3eeecd2fb40" alt="icon" class="img-fluid">
        </div>

        <ul class="nav nav-tabs small">
            <li class="nav-item">
                <a class="nav-link px-2" href="admin-users.html">Users</a>
            </li>
            <li class="nav-item">
                <span class="nav-link active px-2" aria-current="page">Nodes</span>
            </li>
            <li class="nav-item">
                <a class="nav-link px-2" href="admin-system.html">System</a>
            </li>
            <li class="nav-item">
                <span class="nav-link px-2" id="exit">Exit</span>
            </li>
        </ul>

        <div class="card text-start mt-3">
            <div class="card-body bg-light">
                <div class="row g-2">
                    <div class="col-12 col-lg-6">
                        <input type="text" class="form-control form-control-sm" id="body" title="P-Node Info"
                               placeholder='P-Node Info (e.g. {"ip":"...","http_port":1234,"http_token":...})'>
                    </div>
                    <div class="col-12 col-lg-3 d-grid">
                        <button class="btn btn-dark btn-sm" id="create">+ Add Node</button>
                    </div>
                    <div class="col-12 col-lg-3 d-grid">
                        <a class="btn btn-outline-dark btn-sm" href="https://github.com/miladrahimi/p-node"
                           target="_blank">
                            P-Node GitHub
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div id="table" class="celled striped very compact mt-3"></div>
    </div>
</div>

<div class="modal fade" id="node-info-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-start">
            <div class="modal-header">
                <h5 class="modal-title">Node Info</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="d-flex align-items-center gap-2 mb-3">
                    <div class="text-muted small">Node ID:</div>
                    <code class="small" id="node-info-id"></code>
                </div>
                <div class="d-flex align-items-center gap-2 mb-3">
                    <div class="text-muted small">Last Pushed At:</div>
                    <code class="ms-1" id="node-info-push"></code>
                </div>
                <div class="d-flex align-items-center gap-2 mb-3">
                    <div class="text-muted small">Last Pulled At:</div>
                    <code class="ms-1" id="node-info-pull"></code>
                </div>
                <div>
                    <div class="text-muted small mb-1">Pulling Setup Command:</div>
                    <div class="bg-light rounded d-flex align-items-stretch">
                        <pre class="m-0 p-2 small flex-grow-1" id="node-info-command"></pre>
                        <button type="button" class="copy btn btn-dark btn-sm rounded-0 rounded-end"
                                data-copy-target="node-info-command" data-bs-trigger="manual"
                                data-bs-toggle="tooltip" data-bs-placement="left" title="Copy">
                            Copy
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="assets/third_party/jquery-3.7.1.min.js"></script>
<script src="assets/third_party/bootstrap-5.3.5/js/bootstrap.bundle.min.js"></script>
<script src="assets/third_party/tabulator-6.3.1/dist/js/tabulator.min.js"></script>
<script src="assets/js/utils.js?h=c101a9d14ade78e04eeb281043fdbc9f"></script>
<script>
    let statusFormatter = cell => {
        console.log(cell.getValue())
        switch (cell.getValue()) {
            case "":
                cell.getElement().style.color = "#595959"
                return "Processing..."
            case "available":
                cell.getElement().style.color = "#198754"
                return "Available"
            case "dirty":
                cell.getElement().style.color = "#a18823"
                return "Dirty"
            case "unavailable":
                cell.getElement().style.color = "#872919"
                return "Unavailable"
            default:
                cell.getElement().style.color = "#000000"
                return cell.getValue()
        }
    }

    let actionsFormatter = cell => [
        `<span class="badge bg-danger" onclick="destroy('${cell.getRow().getIndex()}')" title="Delete">X</span>`,
        `<span class="badge bg-info" onclick="info('${cell.getRow().getIndex()}')" title="Info">i</span>`,
    ].join('&nbsp')

    let destroy = rowIndex => {
        let confirmed = confirm("Press 'OK' to delete the node.")
        if (!confirmed) {
            return
        }

        let row = table.getRow(rowIndex)
        if (!row.getData().id) {
            table.deleteRow(rowIndex)
            return
        }

        table.alert("Deleting the node...", "msg")

        $.ajax({
            type: "DELETE",
            url: `/api/nodes/${rowIndex}`,
            contentType: "application/json",
            dataType: "json",
            processData: true,
            success: () => {
                table.alert("Item deleted successfully.", "msg")
                setTimeout(() => window.location.reload(), 1000)
            },
            error: makeErrorHandler(message => table.alert(message, "error")),
            complete: () => setTimeout(() => table.clearAlert(), 1500),
        })
    }

    let info = rowIndex => {
        let row = table.getRow(rowIndex)
        let data = row.getData()

        let baseUrl = window.location.origin
        let command = data.pull_command
            .replace('BASE_URL', baseUrl)
            .replace('/v1/', '/api/')

        $("#node-info-id").text(data.id)
        $("#node-info-command").text(command)
        $("#node-info-push").text(ts2datetime(data.pushed_at))
        $("#node-info-pull").text(ts2datetime(data.pulled_at))

        let modal = bootstrap.Modal.getOrCreateInstance(document.getElementById("node-info-modal"))
        modal.show()
    }

    let table = new Tabulator("#table", {
        ajaxURL: "/api/nodes",
        ajaxConfig: {
            headers: {
                "Authorization": `Bearer ${localStorage.getItem("token")}`,
            },
        },
        layout: "fitDataStretch",
        initialSort: [{column: "id", dir: "desc"}],
        validationMode: "blocking",
        columns: [
            {
                title: "Host",
                field: "host",
                editor: "input",
                widthGrow: 2,
                headerFilter: "input",
                validator: ["required"],
                editable: true,
            },
            {
                title: "HTTP Port",
                field: "http_port",
                visible: true,
                editor: "number",
                widthGrow: 1,
                validator: ["required", "min:1", "max:65536"],
                editable: true
            },
            {
                title: "HTTP Token",
                field: "http_token",
                editor: "input",
                widthGrow: 2,
                validator: ["required"],
                editable: true,
            },
            {
                title: "SSH User",
                field: "ssh_user",
                editor: "input",
                widthGrow: 1,
                validator: ["required"],
                editable: true,
            },
            {
                title: "SSH Port",
                field: "ssh_port",
                visible: true,
                editor: "number",
                widthGrow: 1,
                validator: ["required", "min:1", "max:65536"],
                editable: true
            },
            {
                title: "Usage (GB)",
                field: "usage",
                visible: true,
                widthGrow: 1,
                editable: false,
                formatter: cell => parseFloat(cell.getData()['usage']).toFixed(2)
            },
            {
                title: "Push Status", field: "push_status", widthGrow: 1, resizable: true, formatter: statusFormatter,
                headerPopup: "Status of the process where P-Manager pushes configurations to P-Nodes.",
            },
            {
                title: "SSH Status", field: "ssh_status", widthGrow: 1, resizable: true, formatter: statusFormatter,
                headerPopup: "Status of the SSH connection check from the P-Manager to the node.",
            },
            {
                title: "Actions", formatter: actionsFormatter, hozAlign: "right",
            },
        ],
    })

    table.on("dataLoadError", makeErrorHandler())

    table.on("cellEdited", cell => {
        if (!cell.getData()['host'] || !cell.getData()['http_token'] || !cell.getData()['http_port'] ||
            !cell.getData()['ssh_user'] || !cell.getData()['ssh_port']) {
            return
        }

        table.alert("Saving the node...", "msg")

        let isNew = !cell.getData().id
        let method = isNew ? "POST" : "PUT"
        let url = isNew ? "/api/nodes" : `/api/nodes/${cell.getData().id}`

        $.ajax({
            type: method,
            url: url,
            contentType: "application/json",
            data: JSON.stringify(cell.getData()),
            dataType: "json",
            processData: true,
            success: () => {
                table.alert("Item saved successfully.", "msg")
                setTimeout(() => window.location.reload(), 1000)
            },
            error: makeErrorHandler(message => table.alert(message, "error")),
            complete: () => setTimeout(() => table.clearAlert(), 1500),
        })
    })

    $("#create").click(() => {
        let raw = $("#body").val().trim()
        if (!raw) {
            table.alert("Paste the P-Node JSON first.", "error")
            return
        }

        let payload
        try {
            payload = JSON.parse(raw)
        } catch (e) {
            try {
                payload = JSON.parse(raw.replace(/,(\s*[}\]])/g, "$1"))
            } catch (parseError) {
                table.alert("Invalid JSON payload.", "error")
                return
            }
        }

        let host = payload.ip || payload.host || ""
        let httpPort = parseInt(payload.http_port, 10)
        let sshPort = parseInt(payload.ssh_port, 10)
        let httpToken = payload.http_token || ""
        let sshUser = payload.ssh_user || ""

        if (!host || !httpToken || !httpPort || !sshUser || !sshPort) {
            table.alert("JSON payload is missing required fields.", "error")
            return
        }

        let request = {
            host: host,
            http_token: httpToken,
            http_port: httpPort,
            ssh_user: sshUser,
            ssh_port: sshPort,
        }

        table.alert("Adding the node...", "msg")

        $.ajax({
            type: "POST",
            url: "/api/nodes",
            contentType: "application/json",
            data: JSON.stringify(request),
            dataType: "json",
            processData: true,
            headers: {
                "Authorization": `Bearer ${localStorage.getItem("token")}`,
            },
            success: () => {
                table.alert("Item saved successfully.", "msg")
                setTimeout(() => window.location.reload(), 1000)
            },
            error: makeErrorHandler(message => table.alert(message, "error")),
            complete: () => setTimeout(() => table.clearAlert(), 1500),
        })
    })

    const showCopyFeedback = button => {
        const tooltip = bootstrap.Tooltip.getOrCreateInstance(button)
        tooltip.setContent({'.tooltip-inner': 'Copied!'})
        tooltip.show()
        setTimeout(() => tooltip.hide() && tooltip.setContent({'.tooltip-inner': 'Copy'}), 1000)

        const me = $(button)
        me.removeClass('btn-dark').addClass('btn-success')
        setTimeout(() => me.removeClass('btn-success').addClass('btn-dark').blur(), 1000)
    }

    const copyText = text => {
        if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text)
        }

        return new Promise((resolve, reject) => {
            const ta = document.createElement('textarea')
            ta.value = text
            ta.setAttribute('readonly', '')
            ta.style.position = 'absolute'
            ta.style.left = '-9999px'
            ta.style.top = '0'
            document.body.appendChild(ta)
            ta.select()
            ta.setSelectionRange(0, ta.value.length)
            // noinspection JSDeprecatedSymbols
            const ok = document.execCommand('copy')
            document.body.removeChild(ta)
            ok ? resolve() : reject()
        })
    }

    $(document).on('click', '.copy', function () {
        const me = $(this)
        const targetId = me.data('copyTarget')
        let text = ""

        if (targetId) {
            text = $(`#${targetId}`).text()
        } else {
            const link = me.parent().find('a')
            text = link.attr('href') || link.text()
        }

        copyText(text)
            .then(() => showCopyFeedback(this))
            .catch(() => table.alert("Copy failed.", "error"))
    })
</script>

</body>
</html>
