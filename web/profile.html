<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Profile</title>
    <link rel="stylesheet" href="assets/third_party/bootstrap-5.3.5/css/bootstrap.min.css">
    <link rel="icon" href="assets/images/xray.svg?h=03c70e387db88eaafa49e3eeecd2fb40">
    <link rel="apple-touch-icon" href="assets/images/xray.svg?h=03c70e387db88eaafa49e3eeecd2fb40">
    <style>
        .link {
            border: solid rgb(210, 210, 210) 1px;
            border-radius: 0.375rem;
            border-right: none;
        }

        .link a {
            overflow: scroll;
            text-decoration: none;
            display: block;
            padding: 5px;
        }

        .link input[type=button] {
            border: none;
        }
    </style>
</head>
<body>

<div class="container py-4 text-center">
    <div class="col col-md-6 col-lg-4 offset-md-3 offset-lg-4">
        <div class="text-center">
            <img src="assets/images/xray.svg?h=03c70e387db88eaafa49e3eeecd2fb40" alt="icon" class="img-fluid">
        </div>

        <div class="card mt-4">
            <div class="card-body text-center">
                <div>
                    <strong id="name">Loading...</strong>
                    <span class="badge bg-danger d-none" id="disabled-badge">Disabled</span>
                </div>
                <div class="progress mt-3" role="progressbar" aria-label="Usage"
                     aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar bg-dark" style="width: 0" id="progressbar">0%</div>
                </div>
                <div class="text-muted small mt-2">
                    <span id="usage">0</span> / <span id="quota">0</span> GB
                </div>
                <div class="mt-3 text-start">
                    <div id="vless-id" class="d-none my-1">
                        <small class="text-dark-emphasis">VLESS ID:</small>
                        <div class="link small overflow-auto d-flex">
                            <span id="vless-id-value"
                                  class="text-nowrap align-self-center overflow-auto px-2">---</span>
                            <input type="button" class="copy btn btn-dark" value="Copy"
                                   data-copy-target="vless-id-value" data-bs-trigger="manual"
                                   data-bs-toggle="tooltip" data-bs-placement="left" title="Copy">
                        </div>
                    </div>
                    <div id="proxies"></div>
                </div>
                <div class="text-center text-secondary mt-3">
                    <small>Registered @</small>
                    <small id="created_at">-</small>
                </div>
                <button class="btn btn-outline-danger d-block w-100 mt-3 btn-sm" id="regenerate">
                    REFRESH PROFILE
                </button>
            </div>
        </div>
    </div>
</div>

<script src="assets/third_party/jquery-3.7.1.min.js"></script>
<script src="assets/third_party/bootstrap-5.3.5/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/utils.js?h=c101a9d14ade78e04eeb281043fdbc9f"></script>
<script>
    jQuery(() => {
        $.ajax({
            type: "GET",
            url: `/api/profile${window.location.search}`,
            processData: true,
            dataType: "json",
            success: r => {
                $("#name").html(r['user']['name'])
                $("#usage").html(r['user']['usage'])
                $("#created_at").html(ts2date(r['user']['created_at']))

                if (r['user']["enabled"] === false) {
                    $("#disabled-badge").removeClass('d-none')
                }

                const proxyContainer = $("#proxies")
                const proxies = r['proxies'] || {}
                const proxyEntries = Object.entries(proxies).filter(([, value]) => value)

                proxyEntries.forEach(([key, value]) => {
                    const wrapper = $('<div class="my-1"></div>')
                    wrapper.append(`<code class="text-dark-emphasis">${key}:</code>`)

                    const linkRow = $('<div class="link small overflow-auto d-flex"></div>')
                    const link = $('<a type="text" href="#" class="text-nowrap align-self-center overflow-auto"></a>')
                    link.text(value).attr('href', value)
                    const button = $('<input type="button" class="copy btn btn-dark" value="Copy" ' +
                        'data-bs-trigger="manual" data-bs-toggle="tooltip" data-bs-placement="left" title="Copy">')

                    linkRow.append(link, button)
                    wrapper.append(linkRow)
                    proxyContainer.append(wrapper)
                })

                let progressBar = $("#progressbar")
                if (r['user']['quota'] !== 0) {
                    $("#quota").html(r['user']['quota'])
                    let percent = Math.floor(r['user']['usage'] / r['user']['quota'] * 100)
                    progressBar.css("width", String(percent) + "%").html(String(percent) + "%")
                    if (percent > 90) {
                        progressBar.removeClass('bg-dark').addClass('bg-danger')
                    } else if (percent > 60) {
                        progressBar.removeClass('bg-dark').addClass('bg-warning')
                    }
                } else {
                    $("#quota").html('Unlimited')
                    progressBar.css("width", "100%").html("0%")
                    progressBar.removeClass('bg-warning').removeClass('bg-danger')
                }
            },
            error: response => {
                console.log('ERROR', 'Load Profile', response.status, response.responseText)
                alert('Cannot load profile :(')
            },
        })

        $(document).on('click', '.copy', function () {
            const me = $(this)

            const ta = document.createElement('textarea')
            const targetId = me.data('copyTarget')
            if (targetId) {
                ta.value = $(`#${targetId}`).text()
            } else {
                const link = me.parent().find('a')
                ta.value = link.attr('href') || link.text()
            }
            document.body.appendChild(ta)
            ta.select()
            // noinspection JSDeprecatedSymbols
            document.execCommand('copy')
            document.body.removeChild(ta)

            const tooltip = bootstrap.Tooltip.getOrCreateInstance(this)
            tooltip.setContent({'.tooltip-inner': 'Copied!'})
            tooltip.show()
            setTimeout(() => tooltip.hide() && tooltip.setContent({'.tooltip-inner': 'Copy'}), 1000)

            me.removeClass('btn-dark').addClass('btn-success')
            setTimeout(() => me.removeClass('btn-success').addClass('btn-dark').blur(), 1000)
        })

        $('#regenerate').click(function () {
            let confirmed = confirm('Click "OK" to refresh the profile data.')
            if (!confirmed) {
                return
            }

            let me = $(this)
            me.attr('disabled', 'disabled').html('REFRESHING...')

            $.ajax({
                type: 'POST',
                url: `/api/profile/links/regenerate${window.location.search}`,
                dataType: 'json',
                processData: true,
                success: () => {
                    setTimeout(() => {
                        me.html('RELOADING...')
                        setTimeout(() => {
                            alert('Press "OK" to refresh the page.')
                            window.location.reload()
                        }, 2000)
                    }, 2000)
                },
                error: response => {
                    console.log('ERROR', 'REFRESH PROFILE', response.status, response.responseText)
                    me.html('Error!')
                    setTimeout(() => me.html('REFRESH PROFILE').removeAttr('disabled'), 2000)
                }
            })
        })
    })
</script>

</body>
</html>
