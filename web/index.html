<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Sign In</title>
    <link rel="stylesheet" href="assets/css/app.css?v=7">
    <link rel="icon" href="assets/images/xray.svg">
    <link rel="apple-touch-icon" href="assets/images/xray.svg">
    <script src="assets/js/app.js?v=7"></script>
    <script defer src="assets/third_party/alpinejs-3.17.1/alpine.min.js"></script>
</head>
<body class="min-h-screen bg-zinc-50 text-zinc-900 antialiased">

<main class="mx-auto flex min-h-screen w-full max-w-sm flex-col justify-center p-6" x-data="signInPage()">
    <div class="mb-6 flex flex-col items-center gap-3">
        <img src="assets/images/xray.svg" class="h-12 w-12" alt="P-Manager">
        <h1 class="text-lg font-semibold">P-Manager</h1>
    </div>

    <form class="card flex flex-col gap-3 p-6" @submit.prevent="signIn()">
        <div>
            <label class="label" for="username">Username</label>
            <input id="username" type="text" class="input" placeholder="admin"
                   autocomplete="username" x-model="username" required>
        </div>
        <div>
            <label class="label" for="password">Password</label>
            <input id="password" type="password" class="input" placeholder="••••••••"
                   autocomplete="current-password" x-model="password" required>
        </div>
        <p x-cloak x-show="error" class="text-sm text-red-600" x-text="error"></p>
        <button type="submit" class="btn btn-dark mt-1 w-full" :disabled="busy"
                x-text="busy ? 'Signing in...' : 'Sign in'"></button>
    </form>
</main>

<script>
    function signInPage() {
        return {
            username: "",
            password: "",
            busy: false,
            error: "",
            async signIn() {
                this.busy = true
                this.error = ""
                try {
                    const response = await api("POST", "/api/admin/sign-in", {
                        username: this.username,
                        password: this.password,
                    }, {redirectOnUnauthorized: false})
                    localStorage.setItem("token", response["token"])
                    window.location = "admin-accounts.html"
                } catch (e) {
                    this.error = e.message
                    this.busy = false
                }
            },
        }
    }
</script>

</body>
</html>
