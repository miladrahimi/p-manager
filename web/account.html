<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Account</title>
    <link rel="stylesheet" href="/assets/css/app.css?v=7">
    <link rel="icon" href="/assets/images/xray.svg">
    <link rel="apple-touch-icon" href="/assets/images/xray.svg">
    <script src="/assets/js/app.js?v=7"></script>
    <script>i18n.apply(i18n.get()) // before first paint, avoids a direction flip</script>
    <script defer src="/assets/third_party/alpinejs-3.17.1/alpine.min.js"></script>
</head>
<body class="min-h-screen bg-zinc-50 text-zinc-900 antialiased">

<!--
  Screenshots: put one PNG per step at
      /assets/images/help/<app>/<step>.png      e.g. /assets/images/help/v2box/3.png
  where <app> is v2box, onexray, v2rayng or v2rayn and <step> is the 1-based step number.
  An app's optional `firstShot` is the first step that has a screenshot; earlier
  steps show none. A later step whose image is missing shows a dashed placeholder
  with the expected path.
-->

<main class="mx-auto w-full max-w-md p-4 sm:p-6" x-data="accountPage()" x-init="load()">
    <div class="my-6 flex justify-center">
        <img src="/assets/images/xray.svg" class="h-12 w-12" alt="icon">
    </div>

    <!-- Loading -->
    <div x-show="loading" class="card p-6 text-center text-sm text-zinc-400" x-text="t('loading')"></div>

    <!-- Error -->
    <div x-cloak x-show="!loading && error" class="card p-6 text-center">
        <p class="text-sm text-red-600" x-text="error"></p>
        <button class="btn btn-outline mt-4" @click="load()" x-text="t('tryAgain')"></button>
    </div>

    <!-- Account -->
    <div x-cloak x-show="!loading && !error" class="card">
        <div class="p-6">
            <div class="flex items-center justify-between gap-3">
                <h1 class="truncate text-lg font-semibold" x-text="account.name"></h1>
                <span class="chip flex-none" :class="account.enabled ? 'chip-green' : 'chip-red'"
                      x-text="account.enabled ? t('active') : t('disabled')"></span>
            </div>

            <p x-cloak x-show="!account.enabled" class="mt-3 rounded-lg bg-red-50 px-3 py-2 text-xs text-red-700"
               x-text="t('disabledNotice')"></p>

            <!-- Usage -->
            <div class="mt-5">
                <div class="flex items-baseline justify-between text-sm">
                    <span class="text-zinc-500" x-text="t('traffic')"></span>
                    <span class="font-medium tabular-nums"
                          x-text="account.quota > 0
                              ? t('usageOfQuota', {usage: num(account.usage), quota: num(account.quota)})
                              : t('usageUnlimited', {usage: num(account.usage)})"></span>
                </div>
                <template x-if="account.quota > 0">
                    <div class="mt-2">
                        <div class="h-2 w-full overflow-hidden rounded-full bg-zinc-100">
                            <div class="h-full rounded-full transition-all" :class="barColor()" :style="`width:${percent()}%`"></div>
                        </div>
                        <p class="mt-1.5 text-end text-xs tabular-nums text-zinc-400"
                           x-text="percent() >= 100 ? t('quotaExceeded') : t('percentUsed', {percent: num(percent(), 0)})"></p>
                    </div>
                </template>
                <p x-show="!(account.quota > 0)" class="mt-1 text-xs text-zinc-400" x-text="t('unlimited')"></p>
            </div>

            <!-- Subscription -->
            <template x-if="subscriptionUrl">
                <div class="mt-5">
                    <p class="label" x-text="t('subscriptionLink')"></p>
                    <div class="flex items-stretch overflow-hidden rounded-lg border border-zinc-200 bg-zinc-50">
                        <a class="min-w-0 flex-1 truncate p-2.5 text-start font-mono text-xs text-zinc-700" dir="ltr"
                           :href="subscriptionUrl" target="_blank" rel="noopener"
                           :title="subscriptionUrl" x-text="subscriptionUrl"></a>
                        <button class="btn w-20 flex-none rounded-none text-xs"
                                :class="copiedKey === 'subscription' ? 'bg-emerald-600 text-white' : 'btn-dark'"
                                @click="copy('subscription', subscriptionUrl)"
                                x-text="copiedKey === 'subscription' ? t('copied') : t('copy')"></button>
                    </div>
                    <p class="mt-1.5 text-xs text-zinc-400" x-text="t('subscriptionHint')"></p>
                </div>
            </template>

            <!-- Individual links -->
            <template x-if="proxies.length > 0">
                <div class="mt-5 rounded-lg border border-zinc-200">
                    <button type="button" class="flex w-full cursor-pointer items-center justify-between px-4 py-3 text-start"
                            @click="showLinks = !showLinks">
                        <span class="label mb-0" x-text="t('serverLinks', {count: num(proxies.length, 0)})"></span>
                        <svg class="h-4 w-4 flex-none text-zinc-400 transition-transform" :class="showLinks && 'rotate-180'"
                             viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                            <path fill-rule="evenodd" d="M5.22 8.22a.75.75 0 011.06 0L10 11.94l3.72-3.72a.75.75 0 111.06 1.06l-4.25 4.25a.75.75 0 01-1.06 0L5.22 9.28a.75.75 0 010-1.06z" clip-rule="evenodd"/>
                        </svg>
                    </button>
                    <div x-show="showLinks" x-cloak class="space-y-2 border-t border-zinc-100 px-4 pt-3 pb-4">
                        <template x-for="proxy in proxies" :key="proxy.key">
                            <div class="flex items-stretch overflow-hidden rounded-lg border border-zinc-200 bg-zinc-50">
                                <a class="min-w-0 flex-1 p-2.5 text-start" dir="ltr" :href="proxy.value" :title="proxy.value">
                                    <span class="block truncate text-xs font-medium text-zinc-700" x-text="proxy.key"></span>
                                    <span class="block truncate font-mono text-[11px] text-zinc-400" x-text="proxy.value"></span>
                                </a>
                                <button class="btn w-20 flex-none rounded-none text-xs"
                                        :class="copiedKey === proxy.key ? 'bg-emerald-600 text-white' : 'btn-dark'"
                                        @click="copy(proxy.key, proxy.value)"
                                        x-text="copiedKey === proxy.key ? t('copied') : t('copy')"></button>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Setup guide (collapsed by default) -->
            <div class="mt-5 rounded-lg border border-zinc-200">
                <button type="button" class="flex w-full cursor-pointer items-center justify-between px-4 py-3 text-start"
                        @click="showGuide = !showGuide">
                    <span class="label mb-0" x-text="t('setupGuide')"></span>
                    <svg class="h-4 w-4 flex-none text-zinc-400 transition-transform" :class="showGuide && 'rotate-180'"
                         viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M5.22 8.22a.75.75 0 011.06 0L10 11.94l3.72-3.72a.75.75 0 111.06 1.06l-4.25 4.25a.75.75 0 01-1.06 0L5.22 9.28a.75.75 0 010-1.06z" clip-rule="evenodd"/>
                    </svg>
                </button>
                <div x-show="showGuide" x-cloak class="border-t border-zinc-100 px-4 pt-3 pb-4">
                    <p class="text-sm text-zinc-500" x-text="t('guideIntro')"></p>
                    <!-- App tabs -->
                    <div class="mt-3 flex gap-1 rounded-lg bg-zinc-100 p-1">
                        <template x-for="a in apps" :key="a.key">
                            <button class="flex-1 cursor-pointer rounded-md py-1.5 text-sm font-medium transition-colors"
                                    :class="app === a.key ? 'bg-white text-zinc-900 shadow-sm' : 'text-zinc-500 hover:text-zinc-900'"
                                    @click="app = a.key" x-text="a.name"></button>
                        </template>
                    </div>
                    <!-- Platforms and downloads -->
                    <div class="mt-4 flex flex-wrap items-center gap-2 text-xs">
                        <span class="text-zinc-500" x-text="t('availableOn')"></span>
                        <template x-for="s in current().stores" :key="s.name">
                            <a class="chip chip-zinc hover:bg-zinc-200" :href="s.url" target="_blank" rel="noopener" x-text="s.name"></a>
                        </template>
                    </div>
                    <!-- Steps -->
                    <ol class="mt-6 space-y-6">
                        <template x-for="(step, i) in steps()" :key="app + i">
                            <li class="flex gap-3">
                                <span class="flex h-6 w-6 flex-none items-center justify-center rounded-full bg-zinc-900 text-xs font-medium text-white"
                                      x-text="num(i + 1, 0)"></span>
                                <div class="min-w-0 flex-1">
                                    <p class="text-sm leading-6" x-text="step"></p>
                                    <div class="mt-2">
                                        <img class="mx-auto max-h-[420px] rounded-lg border border-zinc-200"
                                             :src="shot(i)" :alt="t('screenshot', {n: num(i + 1, 0)})"
                                             x-show="!missing[shot(i)]" @error="missing[shot(i)] = true">
                                        <div x-show="missing[shot(i)]" x-cloak
                                             class="rounded-lg border border-dashed border-zinc-300 p-6 text-center text-xs text-zinc-400">
                                            <p x-text="t('screenshot', {n: num(i + 1, 0)})"></p>
                                            <p class="mt-1 font-mono text-[11px]" dir="ltr" x-text="shot(i)"></p>
                                        </div>
                                    </div>
                                </div>
                            </li>
                        </template>
                    </ol>
                    <p class="mt-6 text-xs text-zinc-400" x-text="t('tip')"></p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="flex items-center justify-between gap-3 border-t border-zinc-200 px-6 py-4">
            <p class="text-xs text-zinc-400" x-text="t('since', {date: date(account.created_at)})"></p>
            <button class="btn btn-outline-danger btn-xs" :disabled="renewing" @click="renew()"
                    x-text="renewing ? t('renewing') : t('renewLinks')"></button>
        </div>
    </div>

    <!-- Language -->
    <div class="mt-5 flex justify-center gap-4 text-xs">
        <template x-for="l in languages" :key="l.code">
            <button class="cursor-pointer" :lang="l.code"
                    :class="lang === l.code ? 'font-medium text-zinc-900' : 'text-zinc-400 hover:text-zinc-700'"
                    @click="setLang(l.code)" x-text="l.name"></button>
        </template>
    </div>

    <!-- Toasts -->
    <div class="fixed top-4 left-1/2 z-[60] flex w-max max-w-[calc(100vw-2rem)] -translate-x-1/2 flex-col-reverse items-center gap-2">
        <template x-for="t in $store.toast.items" :key="t.id">
            <div class="rounded-lg px-4 py-2.5 text-sm text-white shadow-lg"
                 :class="t.type === 'error' ? 'bg-red-600' : 'bg-zinc-900'" x-text="t.message"></div>
        </template>
    </div>
</main>

                    "از فهرست «Subscriptions» گزینه‌ی «Update subscription (without proxy)» را برگزینید تا سرورها دریافت شوند.",
                    "یک سرور را برگزینید و در پایین پنجره، «System proxy» را روی «Set system proxy» بگذارید (یا Tun را روشن کنید).",
                ],
                en: [
                    "Copy your subscription link above.",
                    "Open v2rayN, open the “Subscriptions” menu and choose “Subscription group settings”.",
                    "Click “Add”, enter a name, paste the link into the URL field and save.",
                    "From the “Subscriptions” menu choose “Update subscription (without proxy)” to fetch the servers.",
                    "Select a server and, at the bottom of the window, set “System proxy” to “Set system proxy” (or enable Tun mode).",
                ],
                zh: [
                    "复制上方的订阅链接。",
                    "打开 v2rayN，进入“订阅”菜单，选择“订阅分组设置”。",
                    "点击“添加”，输入名称，将链接粘贴到 URL 栏并保存。",
                    "在“订阅”菜单中选择“更新订阅（不通过代理）”以获取服务器。",
                    "选择一个服务器，在窗口底部将“系统代理”设为“自动配置系统代理”（或开启 Tun 模式）。",
                ],
            },
        },
    ]

    function accountPage() {
        return {
            lang: i18n.get(),
            languages: i18n.languages,
            account: {},
            proxies: [],
            subscriptionUrl: "",
            showLinks: false,
            showGuide: false,
            apps: apps,
            app: apps[0].key,
            missing: {},
            copiedKey: "",
            loading: true,
            renewing: false,
            error: "",

            t(key, params = {}) {
                return i18n.translate(translations, this.lang, key, params)
            },

            setLang(lang) {
                this.lang = lang
                i18n.apply(lang)
                document.title = this.t("title")
            },

            num(value, digits = 2) {
                return i18n.number(this.lang, value, digits)
            },

            date(timestamp) {
                return i18n.date(this.lang, timestamp)
            },

            accountId() {
                const parts = window.location.pathname.split("/").filter(Boolean)
                return parts.length >= 2 ? parts[parts.length - 1] : null
            },

            async load() {
                document.title = this.t("title")
                this.loading = true
                this.error = ""
                const accountId = this.accountId()
                if (!accountId) {
                    this.error = this.t("accountIdMissing")
                    this.loading = false
                    return
                }
                try {
                    const r = await api("GET", `/api/user/account/${accountId}`)
                    this.account = r["account"]
                    this.proxies = Object.entries(r["proxies"] || {})
                        .filter(([, value]) => value)
                        .map(([key, value]) => ({key: key, value: value}))
                    if (this.account["proxy_id"]) {
                        const host = r["host"] || window.location.host
                        this.subscriptionUrl =
                            `${window.location.origin}/subscription/${this.account["proxy_id"]}#${host}`
                    }
                    // Without a subscription link, the server links are the only thing to copy.
                    this.showLinks = !this.subscriptionUrl
                } catch (e) {
                    this.error = e.message
                } finally {
                    this.loading = false
                }
            },

            current() {
                return apps.find(a => a.key === this.app)
            },

            steps() {
                const steps = this.current().steps
                return steps[this.lang] || steps.en
            },

            shot(index) {
                const step = index + 1
                if (step < (this.current().firstShot || 1)) return null
                return `/assets/images/help/${this.app}/${step}.png`
            },

            percent() {
                if (!this.account.quota) {
                    return 0
                }
                return Math.min(100, Math.floor(this.account.usage / this.account.quota * 100))
            },

            barColor() {
                const percent = this.percent()
                return percent >= 100 ? "bg-red-500" : percent > 80 ? "bg-amber-500" : "bg-zinc-800"
            },

            copy(key, text) {
                copyText(text).then(() => {
                    this.copiedKey = key
                    setTimeout(() => this.copiedKey = "", 1500)
                }).catch(() => this.$store.toast.error(this.t("copyFailed")))
            },

            async renew() {
                if (!confirm(this.t("renewConfirm"))) {
                    return
                }
                this.renewing = true
                try {
                    await api("POST", `/api/user/account/${this.accountId()}/links/renew`)
                    this.$store.toast.info(this.t("renewed"))
                    setTimeout(() => window.location.reload(), 1500)
                } catch (e) {
                    this.renewing = false
                    this.$store.toast.error(e.message)
                }
            },
        }
    }
</script>
