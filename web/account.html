<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Account</title>
    <link rel="stylesheet" href="/assets/css/app.css?v=2">
    <link rel="icon" href="/assets/images/xray.svg">
    <link rel="apple-touch-icon" href="/assets/images/xray.svg">
    <script src="/assets/js/app.js?v=2"></script>
    <script defer src="/assets/third_party/alpinejs-3.17.1/alpine.min.js"></script>
</head>
<body class="min-h-screen bg-zinc-50 text-zinc-900 antialiased">

<main class="mx-auto w-full max-w-md p-4 sm:p-6" x-data="accountPage()" x-init="load()">
    <div class="my-6 flex flex-col items-center gap-3">
        <img src="/assets/images/xray.svg" class="h-12 w-12" alt="icon">
    </div>

    <p x-cloak x-show="error" class="card p-6 text-center text-sm text-red-600" x-text="error"></p>

    <div class="card p-6" x-show="!error">
        <div class="text-center">
            <span class="font-semibold" x-text="account.name || 'Loading...'"></span>
            <span x-cloak x-show="account.enabled === false" class="chip chip-red ml-1">Disabled</span>
        </div>

        <div class="mt-4">
            <div class="h-2 w-full overflow-hidden rounded-full bg-zinc-100">
                <div class="h-full rounded-full transition-all" :class="barColor()" :style="`width:${percent()}%`"></div>
            </div>
            <p class="mt-2 text-center text-xs text-zinc-500">
                <span x-text="account.usage ?? 0"></span> /
                <span x-text="account.quota > 0 ? account.quota : 'Unlimited'"></span> GB
            </p>
        </div>

        <div class="mt-4 space-y-2 text-left">
            <template x-if="subscriptionUrl">
                <div>
                    <p class="label">Subscription</p>
                    <div class="flex items-stretch overflow-hidden rounded-lg border border-zinc-200 bg-zinc-50">
                        <a class="flex-1 overflow-x-auto p-2 font-mono text-xs whitespace-nowrap"
                           :href="subscriptionUrl" target="_blank" rel="noopener" x-text="subscriptionUrl"></a>
                        <button class="btn flex-none rounded-none text-xs"
                                :class="copiedKey === 'subscription' ? 'bg-emerald-600 text-white' : 'btn-dark'"
                                @click="copy('subscription', subscriptionUrl)"
                                x-text="copiedKey === 'subscription' ? 'Copied!' : 'Copy'"></button>
                    </div>
                </div>
            </template>

            <template x-if="showMore">
                <div class="space-y-2">
                    <template x-for="proxy in proxies" :key="proxy.key">
                        <div>
                            <p class="label" x-text="proxy.key"></p>
                            <div class="flex items-stretch overflow-hidden rounded-lg border border-zinc-200 bg-zinc-50">
                                <a class="flex-1 overflow-x-auto p-2 font-mono text-xs whitespace-nowrap"
                                   :href="proxy.value" x-text="proxy.value"></a>
                                <button class="btn flex-none rounded-none text-xs"
                                        :class="copiedKey === proxy.key ? 'bg-emerald-600 text-white' : 'btn-dark'"
                                        @click="copy(proxy.key, proxy.value)"
                                        x-text="copiedKey === proxy.key ? 'Copied!' : 'Copy'"></button>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <button x-cloak x-show="proxies.length > 0" class="btn btn-outline w-full"
                    @click="showMore = !showMore" x-text="showMore ? 'Show less' : 'Show more'"></button>
        </div>

        <p class="mt-4 text-center text-xs text-zinc-400">
            Registered @ <span x-text="ts2date(account.created_at)"></span>
        </p>

        <button class="btn btn-outline-danger mt-4 w-full" :disabled="renewing" @click="renew()"
                x-text="renewing ? 'RENEWING...' : 'RENEW LINKS'"></button>
    </div>
</main>

<script>
    function accountPage() {
        return {
            account: {},
            proxies: [],
            subscriptionUrl: "",
            showMore: false,
            copiedKey: "",
            renewing: false,
            error: "",

            accountId() {
                const parts = window.location.pathname.split("/").filter(Boolean)
                return parts.length >= 2 ? parts[parts.length - 1] : null
            },

            async load() {
                const accountId = this.accountId()
                if (!accountId) {
                    this.error = "Account ID is missing."
                    return
                }
                try {
                    const r = await api("GET", `/api/account/${accountId}`)
                    this.account = r["account"]
                    this.proxies = Object.entries(r["proxies"] || {})
                        .filter(([, value]) => value)
                        .map(([key, value]) => ({key: key, value: value}))
                    if (this.account["proxy_id"]) {
                        const host = r["host"] || window.location.host
                        this.subscriptionUrl =
                            `${window.location.origin}/subscription/${this.account["proxy_id"]}#${host}`
                    }
                } catch (e) {
                    this.error = e.message
                }
            },

            percent() {
                if (!this.account.quota) {
                    return this.account.usage > 0 ? 100 : 0
                }
                return Math.min(100, Math.floor(this.account.usage / this.account.quota * 100))
            },

            barColor() {
                if (!this.account.quota) {
                    return "bg-zinc-400"
                }
                const percent = this.percent()
                return percent > 90 ? "bg-red-500" : percent > 60 ? "bg-amber-500" : "bg-zinc-800"
            },

            copy(key, text) {
                copyText(text).then(() => {
                    this.copiedKey = key
                    setTimeout(() => this.copiedKey = "", 1200)
                }).catch(() => alert("Copy failed."))
            },

            async renew() {
                if (!confirm('Click "OK" to renew links.')) {
                    return
                }
                this.renewing = true
                try {
                    await api("POST", `/api/account/${this.accountId()}/links/renew`)
                    setTimeout(() => window.location.reload(), 2000)
                } catch (e) {
                    this.renewing = false
                    alert(e.message)
                }
            },
        }
    }
</script>

</body>
</html>
